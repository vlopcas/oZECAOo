name: ZECAO • Atualização do YouTube e publicação
run-name: "ZECAO · ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || github.event_name }} · ${{ inputs.batch_id || github.run_id }}"

on:
  push:
    branches: [main]
  schedule:
    # 4 vezes ao dia; horários em UTC. Execuções agendadas podem atrasar.
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Origem do acionamento
        type: choice
        default: manual
        options: [manual, websub, websub_test]
      batch_id:
        description: Identificador de lote do Worker (opcional na execução manual)
        type: string
        required: false
      video_ids:
        description: IDs anunciados, apenas para diagnóstico (não altera a seleção da API)
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
      - name: Validar geração e reservas do site
        run: python3 -m unittest discover -s tests -v
      - name: Consultar vídeos públicos do YouTube
        id: sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_SYNC_REPORT: ${{ runner.temp }}/youtube-sync.json
          SYNC_GITHUB_EVENT: ${{ github.event_name }}
          SYNC_TRIGGER_SOURCE: ${{ inputs.trigger_source || '' }}
          SYNC_BATCH_ID: ${{ inputs.batch_id || '' }}
          SYNC_VIDEO_IDS: ${{ inputs.video_ids || '' }}
        run: python3 scripts/update_videos.py --preserve-published --report "$YOUTUBE_SYNC_REPORT"
      - name: Montar site estático
        id: build
        run: python3 scripts/build_site.py --feed dist/data/videos.json
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Empacotar arquivos estáticos
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - name: Publicar automaticamente
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Resumir sincronização e publicação
        if: always()
        env:
          YOUTUBE_SYNC_REPORT: ${{ runner.temp }}/youtube-sync.json
          BUILD_RESULT: ${{ steps.build.outcome || 'skipped' }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome || 'skipped' }}
        run: >-
          python3 scripts/report_sync.py --report "$YOUTUBE_SYNC_REPORT"
          --build-result "$BUILD_RESULT" --deploy-result "$DEPLOY_RESULT"
