name: ZECAO • Atualização do YouTube e publicação

on:
  push:
    branches: [main]
  schedule:
    # 4 vezes ao dia; horários em UTC. Execuções agendadas podem atrasar.
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
      - name: Validar geração e reservas do site
        run: python3 -m unittest discover -s tests -v
      - name: Consultar vídeos públicos do YouTube
        run: python3 scripts/update_videos.py --preserve-published
      - name: Montar site estático
        run: python3 scripts/build_site.py --feed dist/data/videos.json
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Empacotar arquivos estáticos
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - name: Publicar automaticamente
        id: deployment
        uses: actions/deploy-pages@v5
