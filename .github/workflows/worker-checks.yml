name: YouTube WebSub • Worker checks
on:
  push:
    branches: [main]
    paths: ['workers/youtube-webhook/**', '.github/workflows/worker-checks.yml']
  pull_request:
    paths: ['workers/youtube-webhook/**', '.github/workflows/worker-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/youtube-webhook
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm run dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
